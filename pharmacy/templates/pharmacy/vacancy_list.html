{% extends 'pharmacy/base.html' %}
{% block title %}Вакансии{% endblock %}
{% block content %}
<h2>Вакансии</h2>
<ul class="vacancy-list">
    {% for vacancy in vacancies %}
        <li class="vacancy">
            <h3>{{ vacancy.title }}</h3>
            {{ vacancy.description|linebreaks }}
        </li>
    {% empty %}
        <li class="vacancy">Активных вакансий нет.</li>
    {% endfor %}
</ul>
<p class="clear"></p>
{% endblock %}
